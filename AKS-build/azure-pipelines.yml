trigger:
  branches:
    include:
      - main
      - stage
      - qa
      - dev

  paths:
    include:
      - AKS-build/*

parameters:
- name: environment
  displayName: Target Environment (Manual Override)
  type: string
  default: dev
  values:
  - dev
  - qa
  - stage
  - prod

variables:
  - group: Subscription

  - name: vmImageName
    value: 'ubuntu-latest'

  - name: envName
    ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
      value: 'prod'
    ${{ if eq(variables['Build.SourceBranchName'], 'stage') }}:
      value: 'stage'
    ${{ if eq(variables['Build.SourceBranchName'], 'qa') }}:
      value: 'qa'
    ${{ if eq(variables['Build.SourceBranchName'], 'dev') }}:
      value: 'dev'
    ${{ if not(in(variables['Build.SourceBranchName'], 'main', 'stage', 'qa', 'dev')) }}:
      value: ${{ parameters.environment }}

  - name: workingDirectory
    value: '$(Build.SourcesDirectory)/AKS-build'

pool:
  vmImage: $(vmImageName)

stages:
- stage: Plan
  displayName: Plan - $(envName)
  jobs:
  - job: Terraform_Plan
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: 'Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: 'Subscription'
        backendAzureRmResourceGroupName: 'terraform-deploy'
        backendAzureRmStorageAccountName: 'terraformsflg'
        backendAzureRmContainerName: 'aks-build'
        backendAzureRmKey: '$(envName).terraform.tfstate'

    - task: TerraformTask@5
      displayName: 'Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(workingDirectory)'
        commandOptions: '-var-file=environments/$(envName)/terraform.tfvars'
        environmentServiceNameAzureRM: 'Subscription'

- stage: Apply
  displayName: Apply - $(envName)
  dependsOn: Plan
  condition: succeeded()
  jobs:
  - deployment: Terraform_Apply
    environment: '$(envName)'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTask@5
            displayName: 'Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(workingDirectory)'
              backendServiceArm: 'Subscription'
              backendAzureRmResourceGroupName: 'terraform-deploy'
              backendAzureRmStorageAccountName: 'terraformsflg'
              backendAzureRmContainerName: 'aks-build'
              backendAzureRmKey: '$(envName).terraform.tfstate'
          
          - task: TerraformTask@5
            displayName: 'Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(workingDirectory)'
              commandOptions: '-var-file=environments/$(envName)/terraform.tfvars'
              environmentServiceNameAzureRM: 'Subscription'